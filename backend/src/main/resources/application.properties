# =========================================================================
# Application Configuration
# =========================================================================
spring.application.name=energy-trading-backend
# Server Configuration (Defaulting to 8082 to avoid conflict with Jenkins on 8080)
server.port=${SERVER_PORT:8082}

# =========================================================================
# Database (MySQL with Environment Variables & Local Fallback)
# =========================================================================
spring.datasource.url=${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:energy_trading}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
# database/schema.sql is the authoritative schema. Apply it first, then Hibernate
# only validates that the entities match it. Set JPA_DDL_AUTO=update only for
# throwaway local databases.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# =========================================================================
# Demo Seed Data (households HH-001, HH-002, HH-ADMIN; only seeded into an empty users table)
# =========================================================================
app.seed.enabled=${SEED_DEMO_DATA:true}
# Login passwords for the demo accounts. When unset, a random password is used
# (never logged), so demo logins only work once these are provided.
app.seed.household-password=${DEMO_HOUSEHOLD_PASSWORD:}
app.seed.admin-password=${DEMO_ADMIN_PASSWORD:}

# =========================================================================
# CORS (comma-separated list of allowed browser origins)
# =========================================================================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8082,http://127.0.0.1:8082}

# =========================================================================
# Smart-Meter Validation (Batch 2) - validated at startup
# =========================================================================
# Plausible maximum energy per reading (kWh)
app.meter.max-generated-kwh=${METER_MAX_GENERATED_KWH:25.000}
app.meter.max-consumed-kwh=${METER_MAX_CONSUMED_KWH:25.000}
# Maximum decimal places for energy values (3 = Wh resolution); finer values are rejected, never rounded
app.meter.max-scale=3
# Reading timestamps: tolerated clock skew into the future, and maximum age
app.meter.max-future-skew=${METER_MAX_FUTURE_SKEW:5m}
app.meter.max-reading-age=${METER_MAX_READING_AGE:7d}
# Missing sequence numbers tolerated before a reading is flagged (0 = none)
app.meter.max-sequence-gap=${METER_MAX_SEQUENCE_GAP:0}
# Earlier validated readings older than this are treated as missing history for change checks
app.meter.continuity-window=${METER_CONTINUITY_WINDOW:24h}

# =========================================================================
# Anomaly Detection Rules (Batch 2) - validated at startup
# =========================================================================
# Prices above this (per kWh) are flagged for review
app.anomaly.max-price-per-kwh=${ANOMALY_MAX_PRICE_PER_KWH:15.00}
# Change from the last validated reading that is flagged: absolute (kWh) or relative (3.0 = 300%)
app.anomaly.max-reading-jump-kwh=${ANOMALY_MAX_READING_JUMP_KWH:20.00}
app.anomaly.max-relative-change=${ANOMALY_MAX_RELATIVE_CHANGE:3.0}
# Relative checks are skipped when the previous value is below this baseline (kWh)
app.anomaly.relative-change-min-baseline-kwh=${ANOMALY_RELATIVE_MIN_BASELINE_KWH:1.0}
# Excessive activity: more than N readings per household within the window is flagged
app.anomaly.activity-window=${ANOMALY_ACTIVITY_WINDOW:1h}
app.anomaly.max-readings-per-window=${ANOMALY_MAX_READINGS_PER_WINDOW:12}
# Reserved for the Batch 3 trade-frequency rule
app.anomaly.max-trades-per-hour=10

# =========================================================================
# Privacy (Batch 2)
# =========================================================================
# Secret HMAC key for household pseudonyms (at least 32 characters). REQUIRED: the application
# refuses to start without it. Supply it only through the environment; never commit it.
app.privacy.pseudonym-key=${PRIVACY_PSEUDONYM_KEY:}

# =========================================================================
# Blockchain Configuration (Hardhat Local Node - for Batch 3)
# =========================================================================
app.blockchain.rpc-url=${BLOCKCHAIN_RPC_URL:http://127.0.0.1:8545}
app.blockchain.chain-id=${BLOCKCHAIN_CHAIN_ID:31337}
app.blockchain.contract-address=${CONTRACT_ADDRESS:0x5FbDB2315678afecb367f032d93F642f64180aa3}

# =========================================================================
# Logging
# =========================================================================
logging.level.com.energytrading=INFO
logging.level.org.springframework.web=INFO
