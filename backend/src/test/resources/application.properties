# Test configuration using in-memory H2
spring.application.name=energy-trading-backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

app.anomaly.max-price-per-kwh=15.00
app.anomaly.max-reading-jump-kwh=20.00
app.anomaly.max-trades-per-hour=10

app.seed.enabled=true
app.seed.household-password=test-household-pass
app.seed.admin-password=test-admin-pass
app.cors.allowed-origins=http://localhost:8082

# Test-only pseudonym key (not a real secret)
app.privacy.pseudonym-key=test-only-pseudonym-key-0123456789-abcdef
